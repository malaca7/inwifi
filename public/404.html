<!DOCTYPE html>
<html lang="pt-BR" style="background:#000000;">
  <head>
    <meta charset="utf-8">
    <title>In-Wifi — Redirecionando...</title>
    <style>
      body {
        background-color: #000000;
        color: #00D2FF;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(0, 210, 255, 0.2);
        border-top-color: #00D2FF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="text/javascript">
      var l = window.location;
      var repoSegment = l.pathname.split('/')[1] === 'inwifi' ? '/inwifi' : '';
      var rawPath = l.pathname.slice(repoSegment.length);
      var cleanPath = rawPath.replace(/^\/+/, '');
      var hashPath = cleanPath ? '#/' + cleanPath : '#/dashboard';
      var query = l.search ? l.search : '';
      var newUrl = l.protocol + '//' + l.host + repoSegment + '/' + hashPath + query;
      window.location.replace(newUrl);
    </script>
  </head>
  <body>
    <div class="spinner"></div>
    <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.05em;">Redirecionando para Central In-Wifi...</div>
  </body>
</html>
